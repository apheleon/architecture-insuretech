type Query {
  client(id: ID!): Client
  
  getClient(id: ID!): Client
  getClientDocuments(clientId: ID!): [Document!]!
  getClientRelatives(clientId: ID!): [Relative!]!
}

type Client {
  id: ID!
  name: String!
  age: Int!
  
  documents: [Document!]!
  relatives: [Relative!]!
}

type Document {
  id: ID!
  type: String!
  number: String!
  issueDate: String!
  expiryDate: String!
}

type Relative {
  id: ID!
  relationType: String!
  name: String!
  age: Int!
}

type Mutation {
  createClient(input: CreateClientInput!): Client!
  updateClient(id: ID!, input: UpdateClientInput!): Client!
  addDocument(clientId: ID!, input: DocumentInput!): Document!
  addRelative(clientId: ID!, input: RelativeInput!): Relative!
}

input CreateClientInput {
  name: String!
  age: Int!
}

input UpdateClientInput {
  name: String
  age: Int
}

input DocumentInput {
  type: String!
  number: String!
  issueDate: String!
  expiryDate: String!
}

input RelativeInput {
  relationType: String!
  name: String!
  age: Int!
}